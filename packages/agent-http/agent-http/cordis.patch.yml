# The dsh-agent-http bundle patch: insert the HTTP agent server over the
# profile root. dsh-base (the sibling bundle) supplies the agents, sessions,
# and agentDefaultModel services this plugin drives.
- insert:
    - id: agent-http-server
      name: '@deepseek-ai/dsh-agent-http'
      accessToken: ''   # 留空表示不鉴权；对外暴露前务必改成强随机令牌
