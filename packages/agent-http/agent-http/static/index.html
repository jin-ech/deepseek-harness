<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness · agent-http 跨域调用页</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --panel-2: #f6f8fa;
      --border: #e1e4e8;
      --text: #1f2328;
      --muted: #6a737d;
      --accent: #2563eb;
      --accent-2: #2563eb;
      --ok: #16a34a;
      --err: #dc2626;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
    }

    header .chain {
      font-size: 12px;
      color: var(--muted);
    }

    .basebox {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .basebox input {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      width: 230px;
      outline: none;
    }

    .status {
      margin-left: auto;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }

    .status.ok {
      color: var(--ok);
      border-color: var(--ok);
      background: #f0fdf4;
    }

    .status.err {
      color: var(--err);
      border-color: var(--err);
      background: #fef2f2;
    }

    .status .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      margin-right: 6px;
      vertical-align: middle;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 720px;
      margin: 0 auto;
    }

    .bubble {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: var(--radius);
      /* line-height: 1.6; */
      font-size: 14px;
      /* white-space: pre-wrap; */
      word-break: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .bubble.error {
      align-self: flex-start;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }

    .bubble .meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .bubble.user .meta {
      color: rgba(255, 255, 255, .8);
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* .md { line-height: 1.7; }
    .md pre { background: #f0f2f5; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: #24292f; }
    .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: #f0f2f5; border-radius: 4px; padding: 1px 5px; color: #24292f; }
    .md pre code { background: transparent; padding: 0; }
    .md a { color: var(--accent); }
    .md h1,.md h2,.md h3,.md h4 { margin: .6em 0 .35em; line-height: 1.3; }
    .md p { margin: .4em 0; }
    .md ul,.md ol { margin: .3em 0; padding-left: 1.4em; }
    .md blockquote { margin: .4em 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); }
    .md table { border-collapse: collapse; margin: .5em 0; }
    .md th,.md td { border: 1px solid var(--border); padding: 5px 10px; } */
    .stream-cursor {
      display: inline-block;
      width: .55em;
      height: 1.05em;
      vertical-align: -.15em;
      margin-left: 2px;
      background: var(--accent-2);
      animation: blink 1s steps(1) infinite;
    }

    .activity {
      align-self: flex-start;
      color: var(--muted);
      font-size: 12px;
      padding: 3px 14px 3px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.5;
    }

    .activity .icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .activity .label {
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
    }

    .activity .detail {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 520px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }

    .activity .badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }

    .activity .badge.ok {
      color: var(--ok);
      border-color: #bbf7d0;
      background: #f0fdf4;
    }

    .activity .badge.err {
      color: var(--err);
      border-color: #fecaca;
      background: #fef2f2;
    }

    .reasoning-block {
      align-self: flex-start;
      max-width: 82%;
      margin: 4px 0 4px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fafbfc;
      overflow: hidden;
    }

    .reasoning-block summary {
      cursor: pointer;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reasoning-block summary::before {
      content: "💭";
    }

    .reasoning-block summary::-webkit-details-marker {
      display: none;
    }

    .reasoning-block .reasoning-body {
      padding: 8px 12px;
      font-size: 12px;
      line-height: 1.6;
      color: #4a5568;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
    }

    .chart-container {
      align-self: flex-start;
      width: 100%;
      height: 480px;
      margin: 8px 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      /* overflow: hidden; */
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
    }

    .chart-container .chart-header {
      padding: 8px 12px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--panel-2);
    }

    .chart-container .chart-header .chart-icon {
      font-size: 14px;
    }

    .chart-container .chart-header .chart-title {
      font-weight: 500;
      color: var(--text);
    }

    .chart-container .chart-header .chart-type {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: #eef2ff;
      color: #4f46e5;
      border: 1px solid #c7d2fe;
    }

    .chart-container .chart-body {
      padding: 8px;
    }

    footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 720px;
      margin: 0 auto;
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
    }

    .opts {
      display: flex;
      gap: 14px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .opts input[type="text"],
    .opts input[type="password"] {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      width: 180px;
      outline: none;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 46px;
      max-height: 200px;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent-2);
    }

    button {
      padding: 0 20px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <header>
    <h1>agent-http 调用页</h1>
    <span class="chain">HTML(跨域) → agent-http → DeepSeek Harness · page v4-vendor</span>
    <label class="basebox">服务地址
      <input id="base" type="text" value="http://127.0.0.1:8787" spellcheck="false" />
    </label>
    <span class="status" id="status"><span class="dot"></span>检测中…</span>
  </header>

  <main id="chat"></main>

  <footer>
    <div class="opts">
      <label>会话 ID（留空则新建）
        <input id="session" type="text" placeholder="留空新建；填上次的 ID 可续聊" spellcheck="false" />
      </label>
      <label>访问令牌
        <input id="token" type="password" placeholder="Bearer 令牌（服务端配置了 accessToken 时必填）" spellcheck="false" />
      </label>
    </div>
    <div class="row">
      <textarea id="prompt" placeholder="输入你的问题，例如：你好 / 查询基地列表" rows="2"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint">
      说明：页面与 agent-http 服务跨源，依赖服务端 CORS（agent-http 已返回
      <code>access-control-allow-origin: *</code>）。填会话 ID 可复用同一 agent 进程内会话续聊。
    </div>
  </footer>

  <!-- 本地内置,避免 CDN 在网络受限时加载失败导致图表/Markdown 降级 -->
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/echarts.min.js"></script>
  <script>
    const chat = document.getElementById('chat')
    const promptEl = document.getElementById('prompt')
    const sessionEl = document.getElementById('session')
    const tokenEl = document.getElementById('token')
    const baseEl = document.getElementById('base')
    const sendBtn = document.getElementById('send')
    const statusEl = document.getElementById('status')

    const savedBase = localStorage.getItem('agent-http.base')
    if (savedBase) baseEl.value = savedBase
    const savedToken = localStorage.getItem('agent-http.token')
    if (savedToken) tokenEl.value = savedToken
    const savedSession = localStorage.getItem('agent-http.sessionId')
    if (savedSession) sessionEl.value = savedSession

    function base() {
      return baseEl.value.trim().replace(/\/+$/, '')
    }

    function setStatus(ok, text) {
      statusEl.className = 'status ' + (ok ? 'ok' : 'err')
      statusEl.innerHTML = '<span class="dot"></span>' + text
    }

    function append(kind, text, meta) {
      const div = document.createElement('div')
      div.className = 'bubble ' + kind
      if (meta) {
        const metaNode = document.createElement('div')
        metaNode.className = 'meta'
        metaNode.textContent = meta
        div.appendChild(metaNode)
      }
      div.appendChild(document.createTextNode(text))
      chat.appendChild(div)
      chat.scrollTop = chat.scrollHeight
      return div
    }

    function appendActivity(text) {
      const div = document.createElement('div')
      div.className = 'activity'
      div.textContent = text
      chat.appendChild(div)
      chat.scrollTop = chat.scrollHeight
    }

    // Tool name → icon + Chinese label mapping (mirrors Web GUI style)
    const TOOL_META = {
      read: { icon: '📄', label: '读取' },
      edit: { icon: '✏️', label: '编辑' },
      write: { icon: '📝', label: '写入' },
      glob: { icon: '🔍', label: '搜索文件' },
      grep: { icon: '🔎', label: '搜索内容' },
      bash: { icon: '💻', label: '执行命令' },
      subagent: { icon: '🤖', label: '子代理' },
      web_search: { icon: '🌐', label: '网络搜索' },
      web_fetch: { icon: '📡', label: '获取网页' },
      skill: { icon: '⚡', label: '技能' },
      todo_write: { icon: '📋', label: '任务列表' },
      ask_user_question: { icon: '❓', label: '提问' },
    }

    function renderNode(node) {
      if (!node || !node.type) return
      const div = document.createElement('div')
      div.className = 'activity'

      switch (node.type) {
        case 'turn/start':
          div.innerHTML = '<span class="icon">▶</span><span class="label">轮次开始</span>'
            + (node.turn ? '<span class="badge">#' + node.turn + '</span>' : '')
          break
        case 'step/start':
          div.innerHTML = '<span class="icon">·</span><span class="label">模型请求</span>'
            + (node.step ? '<span class="badge">步骤 ' + node.step + '</span>' : '')
          break
        case 'step/end':
          div.innerHTML = '<span class="icon">·</span><span class="label">步骤结束</span>'
            + (node.step ? '<span class="badge">步骤 ' + node.step + '</span>' : '')
          break
        case 'turn/end':
          div.innerHTML = '<span class="icon">■</span><span class="label">轮次结束</span>'
            + (node.turn ? '<span class="badge">#' + node.turn + '</span>' : '')
          break
        case 'tool/call': {
          const meta = TOOL_META[node.name] || { icon: '🔧', label: node.name || '工具' }
          let html = '<span class="icon">' + meta.icon + '</span>'
            + '<span class="label">' + escapeHtml(meta.label) + '</span>'
          if (node.filePath) {
            html += '<span class="detail">· ' + escapeHtml(node.filePath) + '</span>'
          } else if (node.args) {
            // Show a short snippet of args
            const snippet = node.args.length > 80 ? node.args.slice(0, 80) + '…' : node.args
            html += '<span class="detail">· ' + escapeHtml(snippet) + '</span>'
          }
          div.innerHTML = html
          break
        }
        case 'tool/result': {
          let html = '<span class="icon">✓</span><span class="label">工具返回</span>'
          if (node.error) {
            html += '<span class="badge err">' + escapeHtml(node.error) + '</span>'
          } else {
            html += '<span class="badge ok">成功</span>'
          }
          if (node.summary) {
            html += '<span class="detail">· ' + escapeHtml(node.summary) + '</span>'
          }
          div.innerHTML = html
          // 结构化图表载荷(generate_chart 的 presentation meta)在活动行下方单独成块渲染。
          if (!node.error && node.meta && node.meta.echarts_option) {
            console.log('node.meta: ', node.meta);
            chat.appendChild(div)
            const placeholder = document.createElement('div')
            placeholder.style.width = '100%';
            placeholder.style.height = '480px';
            chat.appendChild(placeholder)
            renderEChart(placeholder, node.meta)
            chat.scrollTop = chat.scrollHeight
            return
          }
          break
        }
        case 'assistant/message': {
          let html = '<span class="icon">📨</span><span class="label">模型响应</span>'
          if (node.usage) {
            html += '<span class="badge">' + node.usage.input + ' + ' + node.usage.output + ' tokens</span>'
          }
          div.innerHTML = html
          break
        }
        default:
          div.innerHTML = '<span class="icon">·</span><span class="label">' + escapeHtml(node.type) + '</span>'
      }
      chat.appendChild(div)
      chat.scrollTop = chat.scrollHeight
    }

    // Reasoning/thinking block management
    let reasoningEl = null
    let reasoningRaw = ''

    function openReasoning() {
      if (reasoningEl) return
      const details = document.createElement('details')
      details.className = 'reasoning-block'
      details.open = true
      const summary = document.createElement('summary')
      summary.textContent = '思考中…'
      const body = document.createElement('div')
      body.className = 'reasoning-body'
      details.appendChild(summary)
      details.appendChild(body)
      chat.appendChild(details)
      reasoningEl = details
      reasoningRaw = ''
      chat.scrollTop = chat.scrollHeight
    }

    function appendReasoning(text) {
      if (!reasoningEl) openReasoning()
      reasoningRaw += text
      const body = reasoningEl.querySelector('.reasoning-body')
      if (body) {
        body.textContent = reasoningRaw
        chat.scrollTop = chat.scrollHeight
      }
    }

    function closeReasoning() {
      if (!reasoningEl) return
      const summary = reasoningEl.querySelector('summary')
      if (summary) {
        const len = reasoningRaw.length
        summary.textContent = len > 0
          ? '思考完成（' + len + ' 字）'
          : '思考'
      }
      reasoningEl.open = false
      reasoningEl = null
      reasoningRaw = ''
    }

    async function health() {
      const target = base() + '/health'
      try {
        const res = await fetch(target, { method: 'GET' })
        const data = await res.json().catch(() => ({}))
        if (data.ok) setStatus(true, '在线 · ready=' + data.ready)
        else setStatus(false, '服务异常' + (data.error ? '：' + data.error : ''))
      } catch (e) {
        setStatus(false, '不可达：' + e.message)
      }
    }

    // 处理 agent-http 的 SSE：delta(逐字) / reasoning(思考) / node(执行节点) / status / done / error
    function handleFrame(frame, cb) {
      let name = 'message'
      let data = ''
      for (const line of frame.split('\n')) {
        if (line.startsWith('event:')) name = line.slice(6).trim()
        else if (line.startsWith('data:')) data += line.slice(5).trim()
      }
      if (!data) return
      let payload
      try { payload = JSON.parse(data) } catch { return }
      if (name === 'delta') cb.onDelta(typeof payload.text === 'string' ? payload.text : '')
      else if (name === 'reasoning') cb.onReasoning(typeof payload.text === 'string' ? payload.text : '')
      else if (name === 'node') cb.onNode(payload)
      else if (name === 'status') cb.onStatus(payload.status)
      else if (name === 'done') cb.onDone(payload)
      else if (name === 'error') cb.onError(payload.message || 'unknown error')
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
    }

    // 先转义再走 marked：模型输出里的原始 HTML 只会按字面显示，不会注入 DOM。
    // 离线/无 marked 时退化为转义后的 <pre> 纯文本。
    function renderMarkdown(src) {
      const esc = escapeHtml(src)
      if (window.marked && typeof window.marked.parse === 'function') {
        try {
          return window.marked.parse(esc, { gfm: true, breaks: true })
        } catch { /* fall through */ }
      }
      return '<pre>' + esc + '</pre>'
    }

    /** Render one ECharts instance into a placeholder element. */
    function renderEChart(placeholder, chartData) {
      const d = chartData
      const width = d.width || '100%'
      const height = d.height || '400px'

      // Build the chart container
      const wrapper = document.createElement('div')
      wrapper.className = 'chart-container'

      const header = document.createElement('div')
      header.className = 'chart-header'
      header.innerHTML = '<span class="chart-icon">📊</span>'
        + '<span class="chart-title">' + escapeHtml(d.title || '图表') + '</span>'
        + '<span class="chart-type">' + escapeHtml(d.chart_type || 'chart') + '</span>'
      wrapper.appendChild(header)

      const body = document.createElement('div')
      body.className = 'chart-body'
      const chartDiv = document.createElement('div')
      chartDiv.style.width = width
      chartDiv.style.height = height
      body.appendChild(chartDiv)
      wrapper.appendChild(body)

      placeholder.replaceWith(wrapper)

      // Initialize ECharts
      if (window.echarts) {
        try {
          const option = d.echarts_option || {}
          // Merge title into option if not already present
          if (d.title && !option.title) {
            option.title = { text: d.title, left: 'center', textStyle: { fontSize: 14 } }
          }
          // Ensure tooltip is enabled
          if (!option.tooltip) {
            option.tooltip = { trigger: d.chart_type === 'pie' ? 'item' : 'axis' }
          }
          const chart = window.echarts.init(chartDiv)
          chart.setOption(option)
          // Responsive resize
          const ro = new ResizeObserver(() => chart.resize())
          ro.observe(chartDiv)
        } catch (e) {
          chartDiv.innerHTML = '<div style="color:var(--err);padding:20px;text-align:center">图表渲染失败: ' + escapeHtml(e.message) + '</div>'
        }
      } else {
        chartDiv.innerHTML = '<div style="color:var(--muted);padding:20px;text-align:center">ECharts 未加载</div>'
      }
    }

    async function run() {
      const prompt = promptEl.value.trim()
      if (!prompt) return
      const target = base() + '/run/stream'

      append('user', prompt, '你 · ' + new Date().toLocaleTimeString())
      promptEl.value = ''
      sendBtn.disabled = true

      let live = null   // 当前正在流式的 assistant 气泡（无文本时为 null）
      let raw = ''      // 当前气泡累积的原文

      function openAssistant() {
        const bubble = document.createElement('div')
        bubble.className = 'bubble assistant'
        const md = document.createElement('div')
        md.className = 'md'
        md.innerHTML = '<span class="stream-cursor"></span>'
        bubble.appendChild(md)
        chat.appendChild(bubble)
        raw = ''
        live = bubble
        return bubble
      }

      function renderLive() {
        if (!live) return
        const md = live.querySelector('.md')
        if (md) {
          md.innerHTML = renderMarkdown(raw) + '<span class="stream-cursor"></span>'
        }
        chat.scrollTop = chat.scrollHeight
      }

      // 收尾当前 assistant 气泡（可选加 meta 行）；返回 null 供下一条 delta 新建。
      function closeAssistant(metaText) {
        if (!live) return
        const md = live.querySelector('.md')
        if (md) {
          md.innerHTML = raw.trim()
            ? renderMarkdown(raw)
            : '<span style="color:var(--muted)">(无文本输出)</span>'
        }
        if (metaText) {
          const meta = document.createElement('div')
          meta.className = 'meta'
          meta.textContent = metaText
          live.insertBefore(meta, md)
        }
        live = null
        raw = ''
        chat.scrollTop = chat.scrollHeight
      }

      try {
        const sessionId = sessionEl.value.trim() || undefined
        const token = tokenEl.value.trim()
        const res = await fetch(target, {
          method: 'POST',
          headers: token
            ? { 'content-type': 'application/json', authorization: 'Bearer ' + token }
            : { 'content-type': 'application/json' },
          body: JSON.stringify(sessionId ? { prompt, sessionId } : { prompt }),
        })
        if (!res.ok) {
          const data = await res.json().catch(() => ({}))
          append('error', '错误：' + (data.error || res.status), 'HTTP ' + res.status)
          return
        }
        if (!res.body) {
          append('error', '响应无流式体', 'HTTP ' + res.status)
          return
        }

        const reader = res.body.getReader()
        const decoder = new TextDecoder()
        let buffer = ''
        for (; ;) {
          const { done, value } = await reader.read()
          if (done) break
          buffer += decoder.decode(value, { stream: true })
          let idx
          while ((idx = buffer.indexOf('\n\n')) >= 0) {
            const frame = buffer.slice(0, idx)
            buffer = buffer.slice(idx + 2)
            if (frame.trim()) {
              handleFrame(frame, {
                onDelta: (text) => { closeReasoning(); if (!live) openAssistant(); raw += text; renderLive() },
                onReasoning: (text) => { appendReasoning(text) },
                onNode: (node) => {
                  // Close reasoning when a non-reasoning node arrives
                  if (node.type !== 'assistant/message') closeReasoning()
                  // Close assistant bubble before showing process nodes
                  if (node.type === 'step/start' || node.type === 'tool/call') closeAssistant()
                  renderNode(node)
                },
                onStatus: (status) => { if (status === 'running') appendActivity('▶ agent 工作中') },
                onDone: (payload) => {
                  closeReasoning()
                  closeAssistant('✓ 完成 · sessionId: ' + (payload.sessionId || '?'))
                  if (payload.sessionId) {
                    sessionEl.value = payload.sessionId
                    localStorage.setItem('agent-http.sessionId', payload.sessionId)
                  }
                },
                onError: (message) => { closeReasoning(); closeAssistant('✗ 失败'); append('error', '错误：' + message, '服务端报错') },
              })
            }
          }
          chat.scrollTop = chat.scrollHeight
        }
        closeAssistant('✓ 完成')
      } catch (e) {
        closeAssistant('✗ 失败')
        append('error', '请求失败：' + e.message, '网络错误')
      } finally {
        sendBtn.disabled = false
        promptEl.focus()
      }
    }

    sendBtn.addEventListener('click', run)
    promptEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run() }
    })
    baseEl.addEventListener('change', () => {
      localStorage.setItem('agent-http.base', baseEl.value.trim())
      health()
    })
    tokenEl.addEventListener('change', () => {
      localStorage.setItem('agent-http.token', tokenEl.value.trim())
    })

    health()
  </script>
</body>

</html>
